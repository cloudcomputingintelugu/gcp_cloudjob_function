steps:
  # ==========================================================
  # Build Docker image
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-repo/bucket-backup:v1'
      - '.'

# ==========================================================
# Push image to Artifact Registry
# ==========================================================
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-repo/bucket-backup:v1'

# ==========================================================
# Cloud Build logging
# ==========================================================
options:
  logging: CLOUD_LOGGING_ONLY
